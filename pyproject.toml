[project]
name = "github-mcp-server"
version = "0.1.0"
description = "MCP server exposing GitHub tools (issues, repo info, labels, comments) to AI assistants, with a 50-question tool-selection accuracy evaluation."
authors = [
    { name = "om panchal", email = "panchalom470@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
github-mcp-server = "github_mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
